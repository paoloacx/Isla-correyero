<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Isla Correyero | Sitio Oficial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #0f1015;
      color: #eae7e1;
      font-family: "Inter", sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      text-align: center;
      background-image: radial-gradient(circle at 50% 20%, rgba(212, 175, 55, 0.08), transparent 70%);
    }
    .container {
      max-width: 680px;
      padding: 3rem 2rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }
    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 600;
      letter-spacing: 0.03em;
      margin-bottom: 0.75rem;
      color: #f7f4ee;
    }
    .subtitle {
      font-size: 1.15rem;
      font-weight: 300;
      color: #c4b58e;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }
    .divider {
      width: 60px;
      height: 1px;
      background: rgba(196, 181, 142, 0.4);
      margin: 0 auto 2rem;
    }
    .status {
      font-size: 1rem;
      color: #9ca3af;
      line-height: 1.6;
      font-weight: 300;
    }
    .badge {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.4rem 1.2rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 2rem;
      background: rgba(196, 181, 142, 0.12);
      color: #d4af37;
      border: 1px solid rgba(196, 181, 142, 0.25);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Isla Correyero</h1>
    <p class="subtitle">Sitio Web Oficial</p>
    <div class="divider"></div>
    <p class="status">Espacio oficial en desarrollo y preparaci&oacute;n.</p>
    <span class="badge">Pr&oacute;ximamente &middot; islacorreyero.es</span>
  </div>
</body>
</html>
